<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyCPnR_PHGRU5caqWuSYleqA6TQB9Xx6A_Q",authDomain:"painel-gerencial-959f0.firebaseapp.com",projectId:"painel-gerencial-959f0",storageBucket:"painel-gerencial-959f0.firebasestorage.app",messagingSenderId:"1074139422123",appId:"1:1074139422123:web:aff64261061e8d0d0f46ee"};
firebase.initializeApp(firebaseConfig);
const db=firebase.firestore();
const sharedDoc=db.collection('painelGerencial').doc('principal');
let connected=false, pendingWrites=0;
function syncStatus(msg,color='#91a3bc'){const el=document.getElementById('syncStatus');if(el){el.textContent=msg;el.style.color=color}}
const KEY='kinology_war_room_v5';const fmt=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const num=s=>{let v=String(s||'').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');return Number(v)||0};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const today=()=>new Date().toISOString().slice(0,10);const monthNow=()=>new Date().toISOString().slice(0,7);
let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){};if(!state||!Array.isArray(state.deals)){state={month:'2026-10',goal:135000,sold:{Helena:0,Ana:0},deals:[],events:[]}};if(!state.months)state.months={[state.month]:{goal:state.goal,sold:{...state.sold}}};
function storeMonth(){state.months[state.month]={goal:state.goal,sold:{...state.sold}}}
function selectMonth(m){if(!/^\d{4}-\d{2}$/.test(m))return;storeMonth();state.month=m;const rec=state.months[m]||{goal:state.goal,sold:{Helena:0,Ana:0}};state.goal=rec.goal;state.sold={...rec.sold};state.months[m]||={goal:rec.goal,sold:{...rec.sold}};save()}
function nextMonth(){let [y,m]=state.month.split('-').map(Number);return new Date(y,m,1).toISOString().slice(0,7)}
function rollover(){const next=nextMonth(),open=active();if(!open.length){alert('Não há negociações abertas para transferir.');return}if(!confirm('Transferir '+open.length+' negociações abertas para '+next+'? As oportunidades originais permanecem no histórico do mês anterior.'))return;for(const d of open){d.status='Transferida';state.deals.push({...d,id:String(Date.now())+Math.random(),created:next+'-01',status:'Aberta',from:d.created})}addEvent(open.length+' negociações transferidas para '+next);selectMonth(next)}
let tab='geral',editing=null;
async function save(){storeMonth();render();if(!connected){syncStatus('Aguardando conexão com Firebase','#fbbf62');return}try{pendingWrites++;syncStatus('Salvando...','#fbbf62');await sharedDoc.set({state:JSON.parse(JSON.stringify(state)),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});syncStatus('● Sincronizado em tempo real','#33d6a6')}catch(e){syncStatus('Erro ao salvar no Firebase','#ff6479');alert('Não foi possível salvar: '+e.message)}finally{pendingWrites--}}
function current(){return state.deals.filter(d=>d.created.slice(0,7)===state.month)}
function active(){return current().filter(d=>d.status==='Aberta')}
function sum(ds){return ds.reduce((s,d)=>s+d.value,0)}
function titleDate(){return new Date(state.month+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}
function addEvent(txt){state.events.unshift({txt,date:new Date().toISOString()});state.events=state.events.slice(0,100)}
function go(t){tab=t;render()}
function render(){let months=new Set([...Object.keys(state.months),...state.deals.map(d=>d.created.slice(0,7)),state.month]);let sel=document.getElementById('monthSelect');sel.innerHTML=[...months].sort().reverse().map(m=>`<option value="${m}" ${m===state.month?'selected':''}>${new Date(m+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</option>`).join('');document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('content').innerHTML=tab==='geral'?general():tab==='historico'?historyView():sellerView(tab==='helena'?'Helena':'Ana')}
function box(label,value,detail){return `<div class="card"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><div class="sub">${detail}</div></div>`}
function general(){let ds=active(),sold=state.sold.Helena+state.sold.Ana,missing=Math.max(0,state.goal-sold),p=state.goal?sold/state.goal*100:0;let temps=['morno','quente','muito'],counts=temps.map(t=>ds.filter(d=>d.temp===t).length),vals=temps.map(t=>sum(ds.filter(d=>d.temp===t))),total=sum(ds);return `<div class="grid kpis">${box('Meta mensal',fmt(state.goal),'Objetivo do time')}${box('Vendas realizadas',fmt(sold),`${p.toFixed(1).replace('.',',')}% da meta`)}${box('Falta para a meta',fmt(missing),'Saldo para atingir o objetivo')}${box('Pipeline SQL aberto',fmt(total),`${ds.length} negociações ativas`)}</div><div class="row" style="margin-top:14px"><span class="sub">Mês selecionado: ${titleDate()} · Os meses anteriores ficam disponíveis no seletor.</span><button class="btn" onclick="rollover()">↗ Transferir abertas para o próximo mês</button></div><div class="grid twocol"><div class="card"><div class="charttitle"><h2 class="section-title">Evolução das oportunidades</h2><span class="pill">Acumulado no mês</span></div><div class="chartlegend"><span><i class="dot" style="background:var(--blue)"></i>Helena</span><span><i class="dot" style="background:var(--red)"></i>Ana</span></div>${plot('deals')}<div class="hint">Soma dos valores cadastrados por data. Negociações ganhas ou perdidas permanecem no histórico do gráfico.</div></div><div class="card"><h2 class="section-title">Termômetro do pipeline</h2><div class="muted small">Distribuição por quantidade de negociações</div><div class="heat">${temps.map((t,i)=>`<div style="width:${ds.length?counts[i]/ds.length*100:0}%;background:${['#f9c35f','#ff945f','#35d5a5'][i]}"></div>`).join('')}</div><div class="legend">${temps.map((t,i)=>`<span><i class="dot" style="background:${['#f9c35f','#ff945f','#35d5a5'][i]}"></i>${['Morno','Quente','Muito quente'][i]}: <strong>${ds.length?Math.round(counts[i]/ds.length*100):0}%</strong> (${counts[i]})</span>`).join('')}</div><div class="statrow" style="margin-top:22px"><span class="muted">Distribuição por valor financeiro</span><strong>${fmt(total)}</strong></div><div class="heat">${temps.map((t,i)=>`<div style="width:${total?vals[i]/total*100:0}%;background:${['#f9c35f','#ff945f','#35d5a5'][i]}"></div>`).join('')}</div><div class="legend">${temps.map((t,i)=>`<span>${['Morno','Quente','Muito quente'][i]}: <strong>${total?Math.round(vals[i]/total*100):0}%</strong></span>`).join('')}</div><div class="note">A temperatura é informativa: nunca altera o valor do negócio nem o pipeline.</div></div></div><div class="grid teamgrid">${sellerCard('Helena')}${sellerCard('Ana')}</div><div class="grid twocol"><div class="card"><div class="charttitle"><h2 class="section-title">Evolução das vendas realizadas</h2><span class="pill">Resultado mensal</span></div><div class="chartlegend"><span><i class="dot" style="background:var(--blue)"></i>Helena</span><span><i class="dot" style="background:var(--red)"></i>Ana</span></div>${plot('sales')}<div class="hint">Este gráfico usa negociações marcadas como ganhas. O valor oficial do realizado é ajustado separadamente em “Meta & mês”.</div></div><div class="card"><h2 class="section-title">Resumo para a reunião</h2><div class="summary">${summary()}</div><div style="margin-top:16px"><button class="btn" onclick="go('historico')">Ver movimentações →</button></div></div></div>`}
function sellerCard(n){let ds=active().filter(d=>d.owner===n),won=current().filter(d=>d.owner===n&&d.status==='Ganha');return `<div class="card person ${n==='Ana'?'ana':''}"><div class="row"><h3 style="color:${n==='Ana'?'var(--red)':'var(--blue)'}">● ${n}</h3><button class="tiny" onclick="go('${n.toLowerCase()}')">Ver negociações →</button></div><div class="grid" style="grid-template-columns:1fr 1fr;margin-top:15px"><div><div class="kpi-label">Realizado oficial</div><div class="big">${fmt(state.sold[n])}</div></div><div><div class="kpi-label">Pipeline aberto</div><div class="big">${fmt(sum(ds))}</div></div></div><div class="row"><span class="sub">${ds.length} negociações abertas</span><span class="sub">${ds.filter(d=>d.temp==='muito').length} muito quentes · ${won.length} ganhas registradas</span></div></div>`}
function summary(){let a=active(),total=sum(a),hot=a.filter(d=>d.temp==='muito');return `O time tem <strong>${a.length} negociações SQL abertas</strong>, totalizando <strong>${fmt(total)}</strong>.<br><br>Há <strong>${hot.length} oportunidades muito quentes</strong>, que representam <strong>${fmt(sum(hot))}</strong> do pipeline.<br><br>Helena possui <strong>${fmt(sum(a.filter(d=>d.owner==='Helena')))}</strong> em negociação; Ana possui <strong>${fmt(sum(a.filter(d=>d.owner==='Ana')))}</strong>.<br><br>O realizado oficial do time está em <strong>${fmt(state.sold.Helena+state.sold.Ana)}</strong> de <strong>${fmt(state.goal)}</strong> de meta.`}
function plot(kind){let ds=current(),days=new Date(Number(state.month.slice(0,4)),Number(state.month.slice(5)),0).getDate(),w=700,h=255,l=66,r=20,t=16,b=38;let series=['Helena','Ana'].map(owner=>Array.from({length:days},(_,i)=>ds.filter(d=>d.owner===owner&&d.created.slice(0,7)===state.month&&Number(d.created.slice(8,10))<=i+1&&(kind==='deals'||d.status==='Ganha')).reduce((s,d)=>s+d.value,0)));let max=Math.max(1,...series.flat())*1.13;let x=i=>l+i/(days-1)*(w-l-r),y=v=>h-b-v/max*(h-t-b);let lines=[0,.25,.5,.75,1].map(k=>`<line x1="${l}" y1="${y(max*k)}" x2="${w-r}" y2="${y(max*k)}" stroke="#304058" stroke-dasharray="4 5"/><text x="${l-10}" y="${y(max*k)+4}" text-anchor="end" fill="#8ea1bb" font-size="11">${max*k>=1000?Math.round(max*k/1000)+'k':Math.round(max*k)}</text>`).join('');let paths=series.map((arr,j)=>`<polyline fill="none" stroke="${j?'#ff6479':'#4c9dff'}" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" points="${arr.map((v,i)=>x(i)+','+y(v)).join(' ')}"/><circle cx="${x(days-1)}" cy="${y(arr[days-1])}" r="5" fill="${j?'#ff6479':'#4c9dff'}"/>`).join('');let ticks=[1,Math.round(days/4),Math.round(days/2),Math.round(days*3/4),days].map(d=>`<text x="${x(d-1)}" y="${h-12}" text-anchor="middle" fill="#90a3be" font-size="11">${String(d).padStart(2,'0')}</text>`).join('');return `<svg class="plot" viewBox="0 0 ${w} ${h}" role="img" aria-label="Gráfico de evolução mensal Helena azul Ana vermelho">${lines}${paths}${ticks}</svg>`}
function sellerView(n){let ds=current().filter(d=>d.owner===n),opened=ds.filter(d=>d.status==='Aberta'),color=n==='Ana'?'var(--red)':'var(--blue)';return `<div class="row" style="margin-bottom:17px"><div><h2 style="margin:0;color:${color}">● Negociações ${n}</h2><p class="sub">Pipeline SQL e resultado mensal · ${titleDate()}</p></div><button class="btn primary" onclick="openDeal(null,'${n}')">＋ Cadastrar negociação</button></div><div class="grid kpis">${box('Pipeline aberto',fmt(sum(opened)),`${opened.length} oportunidades`)}${box('Realizado oficial',fmt(state.sold[n]),'Valor informado em Meta & mês')}${box('Muito quentes',String(opened.filter(d=>d.temp==='muito').length),'Temperatura informativa')}${box('Ganhas registradas',String(ds.filter(d=>d.status==='Ganha').length),'Histórico deste mês')}</div><div class="card" style="margin-top:17px"><div class="row"><h2 class="section-title">Oportunidades</h2><span class="pill">${ds.length} cadastradas</span></div>${ds.length?ds.slice().sort((a,b)=>b.created.localeCompare(a.created)).map(dealRow).join(''):'<div class="empty">Nenhuma negociação cadastrada neste mês. Comece adicionando uma oportunidade SQL.</div>'}</div>`}
function dealRow(d){return `<div class="opp"><div class="row"><div><div class="opp-title">${esc(d.name)} <span class="chip">${esc(d.product||'Negociação')}</span></div><div class="sub" style="margin-top:6px">Cadastrada em ${d.created.split('-').reverse().join('/')} ${d.close?' · Previsão: '+d.close.split('-').reverse().join('/'):''}</div></div><div class="opp-info"><span class="opp-amount">${fmt(d.value)}</span><span class="chip ${d.temp}">${({morno:'● Morno',quente:'● Quente',muito:'● Muito quente'})[d.temp]}</span><span class="chip">${d.status}</span></div></div>${d.next?`<div class="sub" style="margin-top:10px">Próximo passo: ${esc(d.next)}</div>`:''}<div class="editrow"><button class="tiny" onclick="openDeal('${d.id}')">Editar / temperatura</button>${d.status==='Aberta'?`<button class="tiny" onclick="changeStatus('${d.id}','Ganha')">✓ Marcar ganha</button><button class="tiny" onclick="changeStatus('${d.id}','Perdida')">Marcar perdida</button>`:`<button class="tiny" onclick="changeStatus('${d.id}','Aberta')">Reabrir</button>`}<button class="tiny danger" onclick="removeDeal('${d.id}')">Excluir</button></div></div>`}
function historyView(){return `<div class="row" style="margin-bottom:16px"><h2 style="margin:0">Log de Histórico</h2><span class="pill">Histórico compartilhado</span></div><div class="card">${state.events.length?state.events.map(e=>`<div class="activity"><span style="color:#63a8ff">●</span><div><div>${esc(e.txt)}</div><div class="time">${new Date(e.date).toLocaleString('pt-BR')}</div></div></div>`).join(''):'<div class="empty">As próximas movimentações aparecerão aqui.</div>'}</div>`}
function modal(inner){document.getElementById('modalHost').innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row" style="margin-bottom:18px"><h2 style="margin:0">${inner.title}</h2><button class="close" onclick="closeModal()">×</button></div>${inner.body}</div></div>`}
function closeModal(){document.getElementById('modalHost').innerHTML=''}
function openSettings(){modal({title:'Meta e resultado oficial',body:`<form onsubmit="saveSettings(event)" class="formgrid"><label class="field">Mês de referência<input type="month" name="month" required value="${state.month}"></label><label class="field">Meta mensal (R$)<input name="goal" required value="${state.goal.toFixed(2).replace('.',',')}"></label><label class="field">Realizado Helena (R$)<input name="helena" required value="${state.sold.Helena.toFixed(2).replace('.',',')}"></label><label class="field">Realizado Ana (R$)<input name="ana" required value="${state.sold.Ana.toFixed(2).replace('.',',')}"></label><div class="field full"><div class="note">O realizado é informado separadamente a partir do HubSpot. Marcar uma negociação como ganha altera seu status e o gráfico de ganhos registrados, mas não soma automaticamente no realizado oficial, evitando duplicidade.</div></div><button class="btn primary" type="submit">Salvar alterações</button></form>`})}
function saveSettings(e){e.preventDefault();let f=new FormData(e.target);if(state.month!==f.get('month')){storeMonth();state.month=f.get('month')}state.goal=num(f.get('goal'));state.sold.Helena=num(f.get('helena'));state.sold.Ana=num(f.get('ana'));addEvent('Meta e resultados oficiais atualizados');closeModal();save()}
function openDeal(id=null,owner='Helena'){let d=state.deals.find(x=>x.id===id);editing=id;modal({title:d?'Editar negociação':'Nova negociação SQL',body:`<form onsubmit="saveDeal(event)" class="formgrid"><label class="field">Responsável<select name="owner"><option ${((d?.owner||owner)==='Helena')?'selected':''}>Helena</option><option ${((d?.owner||owner)==='Ana')?'selected':''}>Ana</option></select></label><label class="field">Cliente<input name="name" required placeholder="Nome do cliente" value="${esc(d?.name||'')}"></label><label class="field">Produto / descrição<input name="product" placeholder="TrackForce, PalmForce, Kit..." value="${esc(d?.product||'')}"></label><label class="field">Valor integral do negócio (R$)<input name="value" required value="${d?d.value.toFixed(2).replace('.',','):'4297,77'}"></label><label class="field">Data do cadastro<input type="date" name="created" required value="${d?.created||today()}"></label><label class="field">Previsão de fechamento (opcional)<input type="date" name="close" value="${d?.close||''}"></label><label class="field">Temperatura<select name="temp"><option value="morno" ${d?.temp==='morno'?'selected':''}>🟡 Morno</option><option value="quente" ${!d||d.temp==='quente'?'selected':''}>🟠 Quente</option><option value="muito" ${d?.temp==='muito'?'selected':''}>🟢 Muito quente</option></select></label><label class="field">Status<select name="status">${['Aberta','Ganha','Perdida','Transferida'].map(x=>`<option ${d?.status===x?'selected':''}>${x}</option>`).join('')}</select></label><label class="field full">Próximo passo (opcional)<textarea rows="2" name="next" placeholder="Ex.: enviar link de pagamento">${esc(d?.next||'')}</textarea></label><div class="field full"><div class="note">Mudar a temperatura não muda o valor financeiro. O negócio permanece com seu valor integral em todas as visualizações.</div></div><button class="btn primary" type="submit">Salvar negociação</button></form>`})}
function saveDeal(e){e.preventDefault();let f=new FormData(e.target),d={id:editing||String(Date.now())+Math.random().toString(16).slice(2),owner:f.get('owner'),name:f.get('name').trim(),product:f.get('product').trim(),value:num(f.get('value')),created:f.get('created'),close:f.get('close'),temp:f.get('temp'),status:f.get('status'),next:f.get('next').trim()};if(!d.value||d.value<0){alert('Informe um valor válido');return}if(editing){state.deals=state.deals.map(x=>x.id===editing?d:x);addEvent(`${d.owner} atualizou ${d.name} · ${d.temp} · ${fmt(d.value)}`)}else{state.deals.push(d);addEvent(`${d.owner} cadastrou ${d.name} · ${fmt(d.value)}`)}closeModal();save()}
function changeStatus(id,status){let d=state.deals.find(x=>x.id===id);if(!d)return;d.status=status;addEvent(`${d.owner} marcou ${d.name} como ${status.toLowerCase()}`);save()}
function removeDeal(id){let d=state.deals.find(x=>x.id===id);if(!d||!confirm('Excluir esta negociação?'))return;state.deals=state.deals.filter(x=>x.id!==id);addEvent(`Negociação ${d.name} excluída`);save()}
render();
sharedDoc.onSnapshot(async snap=>{
 connected=true;
 if(snap.exists){
   const remote=snap.data().state;
   if(remote && Array.isArray(remote.deals)){
     state=remote;
     if(!state.months)state.months={[state.month]:{goal:state.goal,sold:{...state.sold}}};
     localStorage.setItem(KEY,JSON.stringify(state));
     render();
   }
 }else{
   // O primeiro acesso inicializa o painel compartilhado.
   await save();
 }
 syncStatus('● Sincronizado em tempo real','#33d6a6');
},e=>{connected=false;syncStatus('● Sem acesso ao Firebase','#ff6479');alert('Não foi possível conectar ao Firestore. Confira as regras publicadas no Firebase. '+e.message)});
</script></body></html>
